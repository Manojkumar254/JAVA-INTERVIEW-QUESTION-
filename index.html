<script>
const M=[
["Core Java – OOP & Fundamentals",[
["What are the four main principles of OOP?",`<ul><li><b>Encapsulation</b> – bundling data (fields) and the methods that work on that data into one class, and hiding the internal details by making fields private with public getters/setters.</li><li><b>Inheritance</b> – a child class reusing code from a parent class.</li><li><b>Polymorphism</b> – the same method behaving differently in different classes (method overriding).</li><li><b>Abstraction</b> – hiding complex details and showing only what’s needed, using abstract classes or interfaces.</li></ul>`,`public class Employee {
 private String name;
 public String getName() {
 return name;
 }
 public void setName(String newName) {
 this.name = newName;
 }
}`],
["What is the difference between an abstract class and an interface?",`<p><b>Abstract class:</b> can have both abstract (no body) and concrete (with body) methods, can have fields and constructors, supports only single inheritance, and is used when classes are closely related.</p><p><b>Interface:</b> before Java 8 could only have abstract methods; since Java 8 it can also have default and static methods. It only has constants (public static final fields), cannot have constructors, but a class can implement multiple interfaces (multiple inheritance). Used to define a common behavior/contract.</p>`],
["What is the SOLID principle? Explain briefly.",`<ul><li><b>Single Responsibility:</b> one class = one job.</li><li><b>Open/Closed:</b> open for extension, closed for modification.</li><li><b>Liskov Substitution:</b> a child class should work wherever the parent is expected.</li><li><b>Interface Segregation:</b> don’t force a class to implement methods it doesn’t need.</li><li><b>Dependency Inversion:</b> depend on abstractions, not on concrete classes.</li></ul>`],
["What is a design pattern? Name a few you have used.",`<p>A design pattern is a proven, reusable solution to a common coding problem. Common ones: Singleton (only one instance of a class), Factory (create objects without specifying the exact class), Builder (build complex objects step by step), Strategy (swap algorithms at runtime), Observer (notify multiple objects when something changes).</p>`],
["What is a Singleton class and how do we create it?",`<p>A Singleton ensures a class has only one instance throughout the program and provides a global access point to it. Achieved with: a private constructor (prevents direct instantiation), a static instance variable (stores the single instance), and a static getInstance() method (returns that instance).</p>`],
["What is the difference between 'this' and 'super' keywords?",`<p>'this' refers to the current object – used to access the current class’s fields/methods or call another constructor in the same class.</p><p>'super' refers to the parent class – used to access the parent’s fields/methods or call the parent’s constructor.</p>`],
["What is the difference between a static method and an instance method?",`<p><b>Static method</b> – declared with the static keyword, belongs to the class (not an object), can be called without creating an object, and can only access other static members directly.</p><p><b>Instance method</b> – belongs to an object; you must create an object to call it, and it can access both instance and static members.</p><p>One line: static → tied to the class; instance → tied to the object.</p>`],
["What are constructors in Java and their types?",`<p>A constructor is a special method used to initialize an object. It has the same name as the class, has no return type, and is called automatically when an object is created with 'new'.</p>`,`class Car {
 String model;
 Car(String modelName) {
 model = modelName;
 }
}
Car myCar = new Car("Tesla"); // sets model to "Tesla"`],
["What is the difference between final, finally, and finalize?",`<p><b>final</b> – a keyword used to restrict variables (constant), methods (can’t be overridden), or classes (can’t be extended).</p><p><b>finally</b> – a block used with try-catch that always runs, used for cleanup code.</p><p><b>finalize()</b> – an old method the garbage collector used to call before destroying an object; it’s deprecated now, and try-with-resources is preferred instead.</p>`],
["What is the difference between throw and throws?",`<p>throw is used inside a method to manually throw an exception. throws is used in a method’s signature to declare the exceptions it might throw.</p>`],
["What is the difference between Error and Exception?",`<p>Errors are system-level problems, like OutOfMemoryError, and are usually not recoverable. Exceptions are application-level issues, like NullPointerException, and can be handled with try-catch.</p>`],
["What is a try-catch block used for?",`<p>try-catch is used to handle exceptions at runtime so the application doesn’t crash — the risky code goes in 'try' and the recovery/handling logic goes in 'catch'.</p>`],
["How do you create and handle a custom exception?",`<p>Create a class that extends Exception (checked) or RuntimeException (unchecked), with a constructor that passes the message to super(message). Throw it with 'throw new MyException("...")' and catch it with a normal try-catch.</p>`,`class InsufficientBalanceException extends RuntimeException {
 public InsufficientBalanceException(String msg) {
 super(msg);
 }
}`],
["Can we overload the main() method? Which one does the JVM execute?",`<p>Yes, you can write multiple main() methods with different parameters, but the JVM only ever runs the standard one: public static void main(String[] args). Any other overloaded main() must be called manually from your code.</p>`]
]],
["Data Types, Strings & Memory",[
["What are the primitive vs non-primitive (reference) data types in Java?",`<p><b>Primitive</b> types are the basic built-in types, stored in stack memory, hold actual values, and are lower-case: byte (1 byte), short (2 bytes), int (4 bytes), long (8 bytes), float (4 bytes), double (8 bytes), char (2 bytes), boolean (1 bit).</p><p><b>Non-primitive (reference)</b> types are objects or references to objects, stored in heap memory, hold a reference/address, and are capitalized: String, arrays, classes, interfaces, enums.</p>`],
["What is the difference between == and .equals()?",`<p>== checks whether two references point to the same object in memory. .equals() checks whether the content/value inside two objects is the same.</p>`,`String a = new String("hello");
String b = new String("hello");
a == b // false (different objects)
a.equals(b) // true (same content)`],
["What is the String Pool in Java?",`<p>The String Pool is a special area inside heap memory where Java stores String literals so they can be reused instead of creating duplicate objects. If you write String s1 = "Hello" and String s2 = "Hello", both point to the same object in the pool — no duplicate is created. But String s3 = new String("Hello") always creates a new object outside the pool. This saves memory and improves performance since strings are immutable and used very frequently.</p>`],
["What is the difference between StringBuffer and StringBuilder?",`<p><b>StringBuffer</b> is synchronized (thread-safe) — two threads can’t call its methods at the same time — but this makes it less efficient.</p><p><b>StringBuilder</b> is not synchronized (not thread-safe), but it’s more efficient. Use StringBuilder unless you specifically need thread safety.</p>`],
["What is the difference between deep copy and shallow copy?",`<p><b>Deep copy</b> creates a brand-new object and copies all fields into it, so changes to one object don’t affect the other — new memory is allocated with an independent reference.</p><p><b>Shallow copy</b> only copies the reference, not the actual object — both variables point to the same memory location, so a change through one affects the other.</p>`],
["What is the difference between Array and ArrayList?",`<p><b>Size:</b> Arrays have a fixed size; ArrayLists are dynamic and can grow/shrink.</p><p><b>Data types:</b> Arrays can store primitives (int, char) and objects; ArrayLists can only store objects (use wrapper classes like Integer for primitives).</p><p><b>Performance:</b> Arrays are faster with less overhead; ArrayLists have some overhead from dynamic resizing but are more flexible.</p><p><b>Built-in methods:</b> Arrays have limited methods (e.g. Arrays.sort()); ArrayLists have many (add(), remove(), contains(), size()).</p><p><b>Usage:</b> use an Array when size is fixed and performance is critical; use an ArrayList when you need dynamic sizing or Collections features.</p>`],
["What are Java’s memory areas — Heap, Stack, Method Area, and Program Counter?",`<p><b>Heap</b> – stores all objects and instance variables, shared across threads.</p><p><b>Stack</b> – stores method calls and local variables; each thread has its own stack.</p><p><b>Method Area</b> – stores class-level info like structure, static variables, and method code.</p><p><b>Program Counter (PC)</b> – tracks which instruction a thread is currently executing; each thread has its own PC.</p>`],
["What is garbage collection, and what was the purpose of finalize()?",`<p>Garbage collection is a JVM process that automatically frees memory by destroying objects in the heap that are no longer reachable — preventing memory leaks and optimizing performance, so you don’t manually delete objects like in C++. finalize() used to be the garbage collector’s last chance to let an object clean up before destroying it; it’s deprecated now in favor of try-with-resources.</p>`]
]],
["Collections Framework",[
["What is the Collections Framework in Java?",`<p>Collections is a Java framework to store and handle groups of objects easily, using List, Set, and Map instead of plain arrays. List is ordered and allows duplicates, Set is unordered and holds only unique elements, and Map stores key-value pairs.</p>`],
["What is hashCode used for?",`<p>hashCode() is used in hashing for faster lookups. In collections like HashMap or HashSet, it helps quickly locate which 'bucket' an object belongs in instead of scanning every element.</p>`],
["What is the difference between ArrayList and LinkedList?",`<p><b>ArrayList</b> stores elements in a continuous memory block (like an array) — fast for reading by index, slower for inserting/deleting in the middle.</p><p><b>LinkedList</b> stores elements as nodes connected by pointers — fast for inserting/deleting anywhere, slower for reading by index.</p>`],
["What is the difference between HashMap and ConcurrentHashMap?",`<p><b>HashMap</b> is not thread-safe — if two threads write at the same time, data can get corrupted.</p><p><b>ConcurrentHashMap</b> is thread-safe — it locks only a small part (a segment/bucket) instead of the whole map, so multiple threads can read/write safely and efficiently.</p>`],
["What is the difference between HashSet and HashMap?",`<p><b>HashSet</b> stores only unique values, with no duplicates and no key-value pairing.</p><p><b>HashMap</b> stores key-value pairs where the keys must be unique (values can repeat).</p><p>Set is the interface HashSet implements — it defines a collection of unique elements; HashSet is the hashing-based implementation of it.</p>`],
["What is the difference between HashMap and Hashtable?",`<p><b>Hashtable</b> is synchronized (thread-safe), does not allow null keys or values, and is slower.</p><p><b>HashMap</b> is not synchronized (not thread-safe), allows one null key and multiple null values, and is faster.</p>`]
]],
["Multithreading & Concurrency",[
["What is multithreading, and what are the thread states?",`<p>Multithreading is executing multiple threads simultaneously. A thread is a lightweight sub-process — the smallest unit of processing — and it lets a program use CPU time more efficiently by running parts concurrently.</p><p>Thread states: 1) New – created but not started (new Thread()). 2) Runnable – ready to run after start(), waiting for CPU. 3) Running – the CPU is executing it. 4) Waiting/Blocked/Timed Waiting – paused (e.g. sleep(), join(), wait()). 5) Terminated – finished or stopped.</p>`],
["What is the difference between start() and run()?",`<p>start() creates a new thread and runs your code in parallel.</p><p>run() just calls the method like a normal function call — no new thread is created; it executes on the current thread.</p>`],
["What is the difference between wait() and sleep()?",`<p>sleep() pauses the current thread for a fixed time and does not release any lock it holds.</p><p>wait() pauses the thread until another thread calls notify()/notifyAll(), and it does release the lock so others can use it. wait() must be called inside a synchronized block.</p>`],
["What is synchronization in Java?",`<p>Synchronization ensures only one thread can access a piece of code or object at a time, so shared data doesn’t get corrupted. You use the 'synchronized' keyword on a method or block — like a single key to a room, only the thread holding the key can enter.</p>`],
["What is the difference between Runnable and Callable?",`<p>Runnable’s run() method does not return a value and can’t throw a checked exception.</p><p>Callable’s call() method returns a value and can throw a checked exception. Use Callable with ExecutorService when you need a result back from a thread.</p>`]
]],
["Java 8–17 Features (Lambdas, Streams, Optional)",[
["What are the main features introduced in Java 8?",`<p>Lambda expressions (write shorter code), the Streams API (process lists/collections easily), the Optional class (avoid NullPointerException), default methods in interfaces, and the new Date/Time API (LocalDate, LocalTime).</p>`],
["What is a Lambda expression? Give a simple example.",`<p>A lambda is a short way to write an anonymous function inline, instead of writing a full method.</p>`,`list.sort((a, b) -> a.compareTo(b));\n// (a, b) -> a.compareTo(b) is the lambda`],
["What is the Stream API? When do you use it?",`<p>The Stream API lets you process a collection in a pipeline style — filter, transform, collect — without writing manual loops. Use it when you want to filter, sort, map, or reduce data from a list or set.</p>`,`list.stream().filter(x -> x > 5).collect(Collectors.toList());`],
["What is the difference between map() and flatMap()?",`<p>map() converts each item into exactly one new item (one-to-one). flatMap() converts each item into a stream of items and flattens everything into a single stream (one-to-many).</p><p>Interview tip: splitting sentences into words needs flatMap(), not map().</p>`],
["What are intermediate and terminal operations in the Stream API?",`<p><b>Intermediate operations</b> (filter(), map(), sorted()) return a new stream and are lazy — they don’t execute until a terminal operation is called.</p><p><b>Terminal operations</b> (collect(), forEach(), count()) trigger the actual processing and end the stream.</p>`],
["What is Optional in Java? Why was it introduced?",`<p>Optional is a container object that may or may not contain a value. It was introduced to avoid NullPointerException — instead of returning null, you return Optional.empty() or Optional.of(value), and the caller safely retrieves it with .isPresent() or .orElse().</p>`],
["What is the difference between a functional interface and a marker interface?",`<p>A <b>functional interface</b> has exactly one abstract method and is used with lambdas (e.g. Runnable, Comparator, Predicate). You can create your own with @FunctionalInterface.</p><p>A <b>marker interface</b> has no methods at all — it just tags a class to give it special meaning (e.g. Serializable, Cloneable).</p>`],
["How do you find the minimum-length subarray whose sum equals a given target?",`<p>Use the sliding window technique (works when all numbers are positive): expand a window from the right, adding to a running sum; once the sum reaches the target, shrink from the left while tracking the minimum length. This runs in O(n) time instead of checking every subarray.</p>`]
]],
["Spring Core & Spring Boot",[
["What is Spring Boot and why do we use it?",`<p>Spring Boot makes it easy to create Spring applications quickly. It auto-configures most things (database, security, web server) so you don’t write XML config files, and it comes with an embedded server (Tomcat) so you can run your app directly with java -jar.</p>`],
["What is the difference between @Component, @Service, @Repository, and @Controller?",`<p>All four are Spring stereotypes that register a class as a Spring bean.</p><p><b>@Component</b> – generic bean.<br><b>@Service</b> – marks a business logic class.<br><b>@Repository</b> – marks a DAO/database class (also translates DB exceptions).<br><b>@Controller</b> – marks an MVC controller for handling web requests.<br><b>@RestController</b> = @Controller + @ResponseBody (returns JSON/XML directly).</p>`],
["What is the difference between @Controller and @RestController?",`<p><b>@Controller</b> is for web apps that return HTML views (e.g. Thymeleaf/JSP) — you need @ResponseBody to return raw data.</p><p><b>@RestController</b> is for RESTful APIs that return JSON/XML directly — it’s @Controller + @ResponseBody built in, so no extra annotation is needed.</p>`],
["What is Dependency Injection? How does Spring do it?",`<p>Dependency Injection means Spring creates and provides objects to your class instead of you creating them manually — you just declare what you need and Spring supplies it. You use @Autowired on a field, constructor, or setter to tell Spring to inject the dependency.</p>`],
["What is @Qualifier used for?",`<p>@Qualifier resolves ambiguity when multiple beans of the same type exist, by specifying exactly which bean should be injected into a dependency.</p>`],
["What is the Spring Bean lifecycle?",`<p>1. Spring creates the bean (calls the constructor). 2. Injects dependencies. 3. Calls the @PostConstruct method (initialization logic). 4. Bean is ready to use. 5. On shutdown, calls the @PreDestroy method (cleanup). You can also implement InitializingBean and DisposableBean.</p>`],
["What is @Transactional and how does it work?",`<p>@Transactional wraps a method in a database transaction — if it succeeds, changes are committed; if an exception is thrown, changes are rolled back. By default it only rolls back on RuntimeException (unchecked); for checked exceptions use @Transactional(rollbackFor = Exception.class).</p>`],
["What is transaction propagation? Explain REQUIRED and REQUIRES_NEW.",`<p>Propagation defines what happens when a transactional method is called from another transactional method.</p><p><b>REQUIRED</b> (default) – use the existing transaction if one exists, else create a new one; both share the same transaction.</p><p><b>REQUIRES_NEW</b> – always creates a new transaction; the outer transaction is paused, and the inner one commits/rolls back independently.</p>`],
["What are the transaction isolation levels?",`<p><b>READ_UNCOMMITTED</b> – can read uncommitted data (dirty reads possible).</p><p><b>READ_COMMITTED</b> – reads only committed data (default in most DBs).</p><p><b>REPEATABLE_READ</b> – the same row always returns the same data within a transaction.</p><p><b>SERIALIZABLE</b> – strictest; transactions run one after another, no concurrency issues but slowest.</p>`],
["What is Spring AOP? When would you use it?",`<p>AOP (Aspect Oriented Programming) lets you add extra behavior — like logging, security checks, or performance tracking — to methods without changing the method’s own code. You define an Aspect with advice (what to do) and a pointcut (which methods to apply it to). Common uses: logging, transaction management, security.</p>`],
["What is the difference between @RequestParam and @PathVariable?",`<p>@PathVariable reads a value from the URL path — e.g. /users/42 with @PathVariable int id gives 42.</p><p>@RequestParam reads a value from the query string — e.g. /users?id=42 with @RequestParam int id gives 42.</p>`],
["What is Spring Boot auto-configuration?",`<p>Auto-configuration means Spring Boot automatically sets up beans and settings based on what’s in your classpath. For example, adding spring-boot-starter-data-jpa auto-configures a DataSource, EntityManagerFactory, and TransactionManager. You can always override any auto-configured bean with your own.</p>`],
["How do you handle exceptions globally in Spring Boot?",`<ul><li><b>@ExceptionHandler</b> – handles exceptions in one specific controller.</li><li><b>@ControllerAdvice / @RestControllerAdvice</b> – handles exceptions globally across all controllers.</li><li>Custom exception classes for specific error cases.</li><li>Custom structured error responses (e.g. JSON) returned to clients.</li></ul>`,`@ExceptionHandler(Exception.class)\npublic ResponseEntity<String> handleException(Exception e) {\n return new ResponseEntity<>("Error: " + e.getMessage(), HttpStatus.BAD_REQUEST);\n}`],
["What is Spring Boot Actuator?",`<p>Actuator provides production-ready features to monitor and manage your application. It exposes built-in endpoints with operational info (health, metrics, info, env, thread dumps, etc.) over HTTP or JMX.</p>`]
]],
["Spring Security & JWT",[
["How does Spring Security work at a high level?",`<p>Every incoming HTTP request passes through a chain of filters (the Security Filter Chain), which check authentication (who are you?) and authorization (are you allowed?). If authentication passes, user details are stored in the SecurityContext. If authorization fails, a 403 Forbidden is returned.</p>`],
["What is JWT (JSON Web Token) and how does it work?",`<p>JWT is a token that proves who a user is without storing sessions on the server. Flow: 1) User logs in with username/password. 2) Server creates a JWT with user info and signs it with a secret key. 3) Client sends it in every request (Authorization: Bearer &lt;token&gt;). 4) Server validates the signature and reads the user info from it.</p>`],
["What are the three parts of a JWT?",`<p>A JWT has header.payload.signature, separated by dots:</p><ul><li><b>Header</b> – the algorithm used (e.g. HS256).</li><li><b>Payload</b> – the claims (user id, roles, expiry) — base64-encoded and readable.</li><li><b>Signature</b> – created by signing header+payload with a secret key, which makes the token tamper-proof.</li></ul>`],
["What is RBAC (Role-Based Access Control)?",`<p>RBAC gives access to features based on a user’s role (ADMIN, USER, MANAGER, etc). In Spring Security you use @PreAuthorize("hasRole('ADMIN')") on methods, or .hasRole('ADMIN') in the security config. Roles are usually stored in the JWT or loaded from the database.</p>`],
["What is the difference between authentication and authorization?",`<p><b>Authentication</b> – verifying who you are (login, checking a JWT).</p><p><b>Authorization</b> – verifying what you’re allowed to do (checking if your role has permission for an endpoint or resource).</p>`],
["What is CORS and how do you handle it in Spring Boot?",`<p>CORS (Cross-Origin Resource Sharing) is a browser security feature that blocks requests from a different domain (e.g. a frontend at localhost:3000 calling a backend at localhost:8080). In Spring Boot you allow it with @CrossOrigin on a controller, or globally via http.cors() and a CorsConfigurationSource bean.</p>`]
]],
["Spring Data JPA & Hibernate",[
["What is JPA, and what is Hibernate?",`<p>JPA (Java Persistence API) is a specification — a set of rules for how Java objects map to database tables. Hibernate is the most popular implementation of JPA — it actually converts Java objects to SQL and back.</p>`],
["What is the difference between Repository and JpaRepository?",`<p><b>Repository</b> – the basic marker interface with no methods.</p><p><b>JpaRepository</b> – extends Repository and adds ready-made CRUD and pagination methods.</p>`],
["What is the difference between lazy and eager loading?",`<p><b>Eager loading</b> loads related data immediately with the parent entity (can cause extra/unnecessary queries).</p><p><b>Lazy loading</b> (default for collections) loads related data only when accessed — more efficient, but you must access it while the session is still open, or you get a LazyInitializationException.</p>`],
["What is the N+1 problem, and how do you fix it?",`<p>The N+1 problem: fetching N orders, and for each order Hibernate makes a separate query for its customer — that’s 1 + N queries total. Fix: use JOIN FETCH in JPQL (SELECT o FROM Order o JOIN FETCH o.customer), or use @EntityGraph / batch-size settings to reduce the number of queries.</p>`],
["What is the difference between save() and saveAndFlush()?",`<p><b>save()</b> stores the entity in the persistence context (in memory); the SQL is sent to the DB at the end of the transaction (or on flush).</p><p><b>saveAndFlush()</b> immediately sends the SQL to the database — useful when you need to see the change within the same transaction, or for testing.</p>`],
["What are the different types of JPA relationships?",`<p><b>@OneToOne</b> – one record maps to one record (e.g. User–Profile).</p><p><b>@OneToMany</b> – one maps to many (e.g. Customer–Orders).</p><p><b>@ManyToOne</b> – many map to one (e.g. Orders–Customer).</p><p><b>@ManyToMany</b> – many-to-many via a join table (e.g. Student–Courses).</p>`],
["What is the difference between @Entity and @Table?",`<p>@Entity tells JPA that a class is a database entity that must be persisted.</p><p>@Table is optional and lets you specify a different table name than the class name, e.g. @Entity @Table(name = "tbl_user").</p>`],
["What is JPQL, and how is it different from SQL?",`<p>JPQL (Java Persistence Query Language) is like SQL, but it works on Java entity classes and their fields instead of database tables and columns, and it’s database-independent — Hibernate converts it to the right SQL for your DB.</p>`,`SQL: SELECT * FROM tbl_user WHERE age > 25\nJPQL: SELECT u FROM User u WHERE u.age > 25`]
]],
["Microservices Architecture",[
["What is microservices architecture, and how is it different from a monolith?",`<p><b>Monolithic architecture:</b> one large application where all features are tightly coupled and share a single database — harder to scale and maintain, and a failure in one module can affect the whole system.</p><p><b>Microservices architecture:</b> the app is split into small, independent services (e.g. User, Booking, Payment), each with its own database, communicating via REST APIs or messaging (Kafka). Each service can be developed, deployed, and scaled independently, and a failure in one service doesn’t crash the whole system. Examples: Netflix, Amazon.</p>`],
["What is the standard step-by-step approach to designing and developing microservices?",`<ul><li><b>Identify services</b> – split the app by business domain (User, Booking, Payment).</li><li><b>Build services</b> – use Spring Boot for each microservice.</li><li><b>API communication</b> – REST APIs or Feign clients for inter-service calls.</li><li><b>Service discovery</b> – use Eureka Server.</li><li><b>API Gateway</b> – a central entry point for routing and security.</li><li><b>Security</b> – implement JWT and role-based authentication.</li><li><b>Asynchronous communication</b> – use Kafka for event-driven messaging.</li><li><b>Database per service</b> – each microservice owns its own DB (no sharing).</li><li><b>Deployment</b> – containerize with Docker, orchestrate with Kubernetes.</li><li><b>Monitoring &amp; logging</b> – use Zipkin, ELK stack, and Spring Boot Admin.</li></ul>`],
["What are common microservices design patterns?",`<p><b>API Gateway</b> – single entry point for all client requests.</p><p><b>Service Discovery</b> – services find each other dynamically (Eureka).</p><p><b>Circuit Breaker</b> – stop calling a failed service to prevent cascading failures (Resilience4j).</p><p><b>Saga Pattern</b> – manage distributed transactions across services.</p><p><b>Event-Driven (Kafka)</b> – services communicate via events instead of direct calls.</p>`],
["What is the Saga Pattern? When do you use it?",`<p>Saga is used when one business operation spans multiple microservices (e.g. placing an order: reserve stock → charge payment → notify customer), and you can’t use a single DB transaction since each service has its own DB. Saga breaks the operation into steps; if one step fails, compensating transactions undo the previous steps.</p>`],
["What is a Circuit Breaker? Why is it important?",`<p>If Service A keeps calling a down Service B, A keeps failing and slows down. A Circuit Breaker stops A from calling B after a threshold of failures and returns a fallback response instead. States: Closed (normal), Open (too many failures, block calls), Half-Open (try a test call). In Spring Boot, use Resilience4j’s @CircuitBreaker.</p>`],
["What is service discovery, and how does Eureka work?",`<p>Since service IPs change dynamically in microservices, service discovery lets services find each other by name. Each service registers itself with the Eureka Server on startup (name + IP). When Service A wants to call Service B, it asks Eureka for B’s current address — Feign Client uses Eureka automatically for this.</p>`],
["What is an API Gateway?",`<p>The API Gateway is the single entry point for all client requests. It handles routing (e.g. /orders → order-service, /users → user-service), authentication, rate limiting, and load balancing, so individual services don’t have to handle all of that themselves.</p>`],
["What is distributed tracing, and how does Zipkin help?",`<p>When a request passes through 5 microservices, it’s hard to trace where an error happened. Distributed tracing assigns a unique Trace ID to a request that travels through all services. Zipkin collects these traces and shows a timeline of which service took how long. In Spring Boot, add spring-cloud-starter-sleuth and spring-zipkin to auto-generate and send traces.</p>`],
["How do microservices communicate with each other?",`<p>They communicate through simple methods like HTTP or messaging systems, using APIs that let them exchange data and requests without needing to know how other services are internally built. This lets each service handle its own tasks while still working together as parts of one application.</p>`],
["What is synchronous vs. asynchronous communication?",`<p><b>Synchronous</b> is like a phone call — you talk and the other person responds immediately while both are connected; in software, the caller waits for the task to finish before continuing.</p><p><b>Asynchronous</b> is like email — you send a message and the other side replies whenever they’re ready; in software, tasks run in the background so you can do multiple things at once.</p>`],
["What is serialization?",`<p>Serialization is converting an object into a format (JSON, XML, or binary) so it can be sent over a network or stored in a file. Deserialization is the reverse — converting that data back into an object.</p>`]
]],
["Apache Kafka",[
["What is Kafka, and why do we use it?",`<p>Kafka is a distributed messaging system used for asynchronous communication between services. Instead of Service A calling Service B directly (tight coupling), A publishes an event to a Kafka topic and B listens to it independently. This makes services loosely coupled and more scalable.</p>`],
["What are Topics, Partitions, and Offsets in Kafka?",`<p><b>Topic</b> – a named category where messages are published (like a log file).</p><p><b>Partition</b> – a topic is split into partitions for parallel processing; more partitions = higher throughput.</p><p><b>Offset</b> – each message in a partition has a unique number; consumers track offsets to know what they’ve already processed.</p>`],
["What is a Consumer Group in Kafka?",`<p>A Consumer Group is a set of consumers that together read from a topic. Kafka assigns each partition to only one consumer within the group, so messages aren’t processed twice. If a consumer crashes, Kafka reassigns its partition to another consumer in the group (rebalancing).</p>`],
["What is the difference between at-least-once and exactly-once delivery?",`<p><b>At-least-once</b> – a message is guaranteed to be delivered but may be processed more than once (if a consumer crashes after processing but before committing the offset); needs idempotency to handle duplicates.</p><p><b>Exactly-once</b> – a message is processed exactly once, supported by Kafka’s idempotent producers and transactional APIs, but it’s more complex and slightly slower.</p>`],
["What happens if a Kafka consumer is slow or crashes?",`<p>If a consumer crashes, Kafka detects it via a heartbeat timeout and triggers a rebalance — other consumers take over its partitions. If a consumer is slow, messages queue up (lag); you can scale by adding more consumers, up to the number of partitions. Kafka retains messages for a configured time (default 7 days) regardless of consumption.</p>`]
]],
["Database & SQL",[
["What is database indexing? When should you use it?",`<p>An index is like a book’s index — it helps the database find rows faster without scanning the whole table. Use indexes on columns used in WHERE, JOIN, or ORDER BY, but don’t index every column since indexes slow down INSERT/UPDATE. A covering index includes every column a query needs, avoiding table lookups entirely.</p>`],
["What is the difference between a clustered and a non-clustered index?",`<p><b>Clustered index</b> – the table’s data is physically sorted in the order of this index; a table can only have one (in MySQL/InnoDB, the primary key is always the clustered index).</p><p><b>Non-clustered index</b> – a separate structure that stores pointers to rows; a table can have multiple non-clustered indexes.</p>`],
["What is the difference between primary key and unique key?",`<p><b>Primary Key:</b> uniquely identifies each row, does NOT allow NULL, only one per table, and automatically creates an index (implicitly NOT NULL + UNIQUE).</p><p><b>Unique Key:</b> ensures values in a column are unique, allows NULL (typically one NULL per row in MySQL), and a table can have multiple unique keys.</p>`],
["What is the difference between optimistic and pessimistic locking?",`<p><b>Pessimistic locking</b> – lock the row when you read it so no one else can update it until you’re done (SELECT FOR UPDATE); use when conflicts are frequent.</p><p><b>Optimistic locking</b> – don’t lock; add a version column and check it hasn’t changed before updating (throw an error if it has). Use @Version in JPA; good for low-conflict scenarios.</p>`],
["How do you write a SQL query to rank employees by experience?",`<p>Use the RANK() window function.</p>`,`SELECT name, experience,\n RANK() OVER (ORDER BY experience DESC) AS rnk\nFROM employees;`],
["What is the difference between RANK(), DENSE_RANK(), and ROW_NUMBER()?",`<p><b>ROW_NUMBER()</b> gives every row a unique number (1, 2, 3, 4...) even for tied values.</p><p><b>RANK()</b> gives tied values the same rank but skips the next number(s): 1, 2, 2, 4.</p><p><b>DENSE_RANK()</b> gives tied values the same rank without skipping: 1, 2, 2, 3.</p>`],
["What is the actual execution order of an SQL query’s clauses?",`<p>SQL is written as SELECT...FROM...WHERE...GROUP BY...HAVING...ORDER BY, but it doesn’t run in that order. Actual execution order:</p><p><b>FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT.</b></p><p>That’s why a column alias created in SELECT can be used in ORDER BY, but not in WHERE.</p>`]
]],
["Redis Caching",[
["What is the Cache-Aside pattern, and how have you used Redis?",`<p>Cache-Aside (Lazy Loading): 1) the app checks Redis first. 2) If found (cache hit), return it. 3) If not found (cache miss), fetch from the DB, store it in Redis, then return it.</p><p>Example use: caching booking/hotel data in Redis made frequently-read booking APIs about 40% faster since the DB wasn’t hit every time.</p>`],
["What are cache eviction policies in Redis?",`<p>When Redis runs out of memory it evicts keys based on policy:</p><p><b>LRU</b> (Least Recently Used) – removes keys not accessed recently.</p><p><b>LFU</b> (Least Frequently Used) – removes keys accessed least often.</p><p><b>TTL-based</b> – keys expire automatically after a set time.</p><p><b>noeviction</b> – rejects new writes when memory is full.</p><p>For booking data, TTL-based expiry is common to keep data fresh.</p>`]
]],
["Docker",[
["What is Docker, and why is it used?",`<p>Docker is a containerization platform that packages an application with all its dependencies into a container, so it runs consistently across environments. It resolves compatibility issues, speeds up deployment across multiple servers, and makes upgrades and scaling easier.</p>`],
["What is the difference between a Docker Image and a Container?",`<p><b>Image</b> – a read-only template/blueprint (like a class in Java).</p><p><b>Container</b> – a running instance of an image (like an object in Java). You can run multiple isolated containers from the same image, each with its own filesystem, network, and process space.</p>`],
["How are containers different from Virtual Machines (VMs)?",`<p>Containers share the host OS kernel (no kernel of their own) and are lightweight — they just need the image + dependencies to run fast. VMs each need a full OS installation, making them heavier.</p>`],
["Explain Docker’s architecture.",`<p><b>Dockerfile</b> → instructions to build an image.</p><p><b>Docker Image</b> → the application + dependencies, packaged.</p><p><b>Docker Registry (Hub)</b> → stores and shares images.</p><p><b>Docker Container</b> → an isolated environment running an image.</p><p><b>Docker Engine</b> → runs and manages containers, bridging them with the host OS.</p>`],
["What are the key instructions in a Dockerfile?",`<p><b>FROM</b> – base image. <b>LABEL</b> – metadata/author info. <b>RUN</b> – run commands during the image build. <b>CMD</b> – default command (only the last CMD executes, and it can be overridden at runtime). <b>ENTRYPOINT</b> – a fixed command that cannot be overridden. <b>COPY</b> – copy files from host to container. <b>ADD</b> – like COPY but also extracts tar files (don’t use ADD for URLs — that’s a common trap). <b>WORKDIR</b> – set the working directory. <b>EXPOSE</b> – documents the container’s port.</p>`],
["What is the difference between CMD and ENTRYPOINT, and between COPY and ADD?",`<p>CMD sets a default command that can be overridden when the container runs; ENTRYPOINT sets a fixed command that cannot be overridden.</p><p>COPY simply copies files from host to container; ADD does the same but also auto-extracts compressed/tar files.</p>`],
["What are some common Docker commands?",`<p><b>docker pull &lt;image&gt;</b> – download an image.<br><b>docker run &lt;image&gt;</b> – run an image as a container.<br><b>docker ps / docker ps -a</b> – list running / all containers.<br><b>docker stop &lt;id&gt; / docker start &lt;id&gt;</b> – stop/start a container.<br><b>docker rm &lt;id&gt; / docker rmi &lt;id&gt;</b> – remove a container/image.<br><b>docker system prune -a</b> – clean up unused containers &amp; images.</p>`],
["What is port mapping in Docker?",`<p>Port mapping connects a host machine port to a container port so you can access apps running inside a container from outside.</p>`,`docker run -d -p 9090:9090 myapp\n# host port 9090 -> container port 9090`],
["How would you Dockerize a Spring Boot application?",`<p>1) Package the app: mvn clean package.<br>2) Write a Dockerfile.<br>3) Build and run the image.</p>`,`FROM openjdk:17\nCOPY target/demo-app.jar /usr/app/\nWORKDIR /usr/app/\nEXPOSE 8080\nENTRYPOINT ["java", "-jar", "demo-app.jar"]\n# then:\ndocker build -t username/demo-app:v1 .\ndocker run -d -p 8080:8080 username/demo-app:v1`],
["How do you push a Docker image to Docker Hub?",`<p>docker login, then docker build -t username/app:tag ., then docker push username/app:tag. Docker Hub is a cloud-based registry for storing and sharing images.</p>`]
]],
["Kubernetes & AWS",[
["What is Kubernetes, and what problem does it solve?",`<p>Kubernetes (K8s) automates deployment, scaling, and management of containers. Without it you’d manually start/stop containers, handle crashes, and scale by hand. With K8s: it auto-restarts crashed containers (self-healing), scales containers up/down based on traffic (HPA), load balances traffic across containers, and manages rollouts with zero downtime.</p>`],
["What is the difference between a Pod, Deployment, and Service in Kubernetes?",`<p><b>Pod</b> – the smallest unit; runs one or more containers together.</p><p><b>Deployment</b> – manages pods, ensures the desired number of replicas run, and handles rolling updates.</p><p><b>Service</b> – gives a stable IP/DNS name to reach pods, since pod IPs change (types: ClusterIP internal, NodePort external via node, LoadBalancer via a cloud LB like AWS ALB).</p>`],
["What is HPA (Horizontal Pod Autoscaler)?",`<p>HPA automatically scales the number of pods up or down based on metrics like CPU usage — e.g. if CPU goes above 70%, HPA adds pods; when load drops, it removes pods — so the app handles traffic spikes without wasting resources at low load.</p>`],
["What is the difference between EC2, ECS, and EKS in AWS?",`<p><b>EC2</b> – a virtual machine in the cloud; you manage the OS and software.</p><p><b>ECS (Elastic Container Service)</b> – AWS-managed container service; simpler than K8s but less flexible.</p><p><b>EKS (Elastic Kubernetes Service)</b> – AWS-managed Kubernetes; AWS manages the control plane while you manage worker nodes and deployments.</p>`],
["What is Amazon S3, and how do you upload images to it from a Spring Boot app?",`<p>S3 is a highly scalable, durable, and secure object storage service for any amount of data (files, images, videos, logs, backups). Key concepts: Bucket (a top-level folder for objects), Object (any uploaded file, with metadata and a key), Key (the object’s unique name), Region (where the bucket lives), Storage Classes (cost/durability tiers like Standard or Intelligent-Tiering).</p><p>Steps to upload from Spring Boot: add the AWS SDK dependency in pom.xml → configure AWS credentials (properties file or IAM role) → create an S3Client bean with access key, secret key, and region → write a service method using s3Client.putObject() to upload a MultipartFile → expose a REST endpoint that accepts the file and calls the service → test with Postman and get the S3 file URL back.</p>`]
]],
["Testing (JUnit & Mockito)",[
["What is the difference between unit testing and integration testing?",`<p><b>Unit testing</b> tests a single class/method in isolation, replacing external dependencies (DB, other services) with mocks — fast to run.</p><p><b>Integration testing</b> tests how multiple components work together (e.g. controller + service + DB), typically using @SpringBootTest to load the full context — slower but more realistic.</p>`],
["What is Mockito? How do you use @Mock and @InjectMocks?",`<p>@Mock creates a fake object of a class — it does nothing real; you tell it what to return.</p><p>@InjectMocks creates the actual class under test and automatically injects all @Mock objects into it.</p>`,`@Mock UserRepository repo;\n@InjectMocks UserService service;\nwhen(repo.findById(1)).thenReturn(Optional.of(user));`],
["What is the difference between @Mock and @MockBean?",`<p><b>@Mock</b> (plain Mockito) is used in pure unit tests without loading a Spring context — fast.</p><p><b>@MockBean</b> (Spring Boot Test) replaces a real Spring bean in the application context with a mock — used in integration tests (@SpringBootTest or @WebMvcTest).</p>`],
["What is @WebMvcTest, and when do you use it?",`<p>@WebMvcTest loads only the web layer (controller) of the Spring context, not the service or repository layers, so you can test REST controllers in isolation. You use MockMvc to simulate HTTP requests and verify responses, mocking dependencies with @MockBean.</p>`],
["How do you achieve 85%+ code coverage, and what does code coverage mean?",`<p>Code coverage is the percentage of your code executed by tests. To hit 85%+: write tests for all service methods, cover both happy-path and error cases, and use the JaCoCo Maven plugin to generate coverage reports. High coverage doesn’t guarantee bug-free code — you still need meaningful assertions.</p>`]
]],
["System Design & Behavioral",[
["How would you design a Hotel Booking System?",`<p><b>Services:</b> User, Hotel, Room Inventory, Booking, Payment, Notification, Search.</p><p><b>Flow:</b> user searches hotels (Elasticsearch) → books a room → Booking service publishes an event to Kafka → Payment service listens, charges via Stripe, publishes a payment event → Notification service listens and sends email/SMS via SendGrid/Twilio.</p><p><b>Key points:</b> Redis caches hotel/room data, JWT secures all endpoints, EKS hosts all services, an API Gateway routes traffic, and Zipkin traces requests.</p>`],
["How do you handle a situation where a service is down during a booking?",`<p>Use the Circuit Breaker pattern (Resilience4j): if Payment is down, stop calling it after N failures and return a fallback (e.g. 'Payment unavailable, try later'). For data consistency, use the Saga pattern with compensating transactions — if payment fails after a booking is created, publish a 'cancel booking' event via Kafka so services stay loosely coupled.</p>`],
["How did you reduce DB query time by 40%? Walk me through it.",`<p>Used EXPLAIN in MySQL to find slow queries — discovered missing indexes on frequently-queried columns (hotel_id, check_in_date). Added composite indexes for multi-column queries. Introduced Redis caching for hotel-listing APIs with a cache-aside pattern and a 15-minute TTL. Result: cache hits served in under 5ms vs 80ms+ from the DB — combined with the query optimizations, overall DB load dropped by 40%.</p>`],
["Tell me about a challenging problem you solved at work.",`<p>Use the STAR method: Situation (brief context), Task (what you were responsible for), Action (the specific technical steps you took), Result (the measurable outcome). Example: optimizing a booking platform to handle 50K+ daily transactions — identifying bottlenecks, adding Redis caching, decoupling services with Kafka, and the measurable performance result.</p>`],
["What is the CAP theorem? Which did your system prioritize?",`<p>CAP theorem: a distributed system can guarantee at most 2 of 3 properties — Consistency (all nodes see the same data at the same time), Availability (the system always responds, even if data is slightly stale), and Partition Tolerance (the system keeps working through a network split).</p><p>For a booking system, AP is typical: high availability matters most, and slight eventual consistency (e.g. a briefly stale Redis cache) is acceptable.</p>`],
["What is the difference between horizontal and vertical scaling?",`<p><b>Vertical scaling</b> – upgrade the same machine (more CPU/RAM); has limits and is a single point of failure.</p><p><b>Horizontal scaling</b> – add more machines/instances. A booking system might use Kubernetes HPA to auto-scale pods horizontally when traffic increases — the preferred approach for microservices and cloud-native apps.</p>`]
]]];
